name: Build and deploy (Core)
env:
  OUTPUT_FOLDER: hugo-output

on:
  workflow_call:
    inputs:
      preview:
        required: false
        type: boolean
        default: false

jobs:
  build_hugo:
    runs-on: ubuntu-latest
    environment: build
    steps:
      - uses: actions/checkout@v3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        if: ${{ inputs.preview == false }}
        run: hugo --minify --source ./src --destination ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }} --config config.toml,config.speaking.toml

      - name: Build (preview)
        if: ${{ inputs.preview == true }}
        run: hugo --minify --source ./src --destination ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }} --config config.toml,config.speaking.toml --buildDrafts --buildFuture --baseURL '/'

      - name: Compress generated images
        if: success()
        run: node ./scripts/compress-images.js --input "${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}"

      - name: Build search index
        run: npx --yes pagefind@1.4.0 --site "${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}"

      - name: Publish website output
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}
          if-no-files-found: error

      - name: Publish blog json
        uses: actions/upload-artifact@v4
        with:
          name: json
          path: ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}/index.json
          if-no-files-found: error

  build_api:
    runs-on: ubuntu-latest
    environment: build
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build
      - run: mkdir ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}
      - run: tar -cvf ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}/api.tar .

      - name: Publish API output
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}/api.tar

  provision:
    needs: [build_hugo, build_api]
    runs-on: ubuntu-latest
    environment: production
    name: Provision Azure
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group exists
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az group create -g ${{ secrets.RESOURCE_GROUP }} -l ${{ secrets.RESOURCE_GROUP_LOCATION }}
      - name: Deploy Bicep
        uses: azure/bicep-deploy@v1
        with:
          resource-group-name: ${{ secrets.RESOURCE_GROUP }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          template-file: ./deploy/main.bicep
          parameters: '{ "swaName": "${{ secrets.SWA_NAME }}" }'
          scope: resourceGroup
          type: deployment
          operation: create
          name: ${{ secrets.SWA_NAME }}

  deploy:
    needs: [provision]
    runs-on: ubuntu-latest
    environment: production
    name: Deploy SWA
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get SWA deployment token
        uses: azure/CLI@v1
        id: swa-token
        with:
          inlineScript: |
            SWA_DEPLOYMENT_TOKEN=$(az staticwebapp secrets list -n ${{ secrets.SWA_NAME }} -o tsv --query properties.apiKey)
            echo "::add-mask::$SWA_DEPLOYMENT_TOKEN"
            echo SWA_DEPLOYMENT_TOKEN=$SWA_DEPLOYMENT_TOKEN >> $GITHUB_ENV

      - name: Download website
        uses: actions/download-artifact@v4
        with:
          name: website
          path: ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}

      - name: Download api
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ${{ github.workspace }}
      - run: |
          mkdir ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}-api
          tar -xf ${{ github.workspace }}/api.tar -C ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}-api
      - name: Download index source
        uses: actions/download-artifact@v4
        with:
          name: json
          path: ${{ github.workspace }}/${{ env.OUTPUT_FOLDER }}-api

      - name: Deploy frontend
        id: build-deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          skip_api_build: true
          app_location: ${{ env.OUTPUT_FOLDER }}
          api_location: ${{ env.OUTPUT_FOLDER }}-api

  update_readme:
    needs: [deploy]
    runs-on: ubuntu-latest
    name: Update my readme
    environment: production
    if: github.event_name != 'pull_request'
    # continue-on-error so a stale/expired PERSONAL_TOKEN doesn't block deploys.
    # PERSONAL_TOKEN requires a classic PAT (or fine-grained PAT) with the
    # "workflow" scope to trigger workflow_dispatch in aaronpowell/aaronpowell.
    continue-on-error: true
    steps:
      - name: Trigger readme update
        run: gh workflow run "Update" --repo aaronpowell/aaronpowell --ref main
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
